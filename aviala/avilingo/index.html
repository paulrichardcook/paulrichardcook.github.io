<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avilingo - Bird name translator</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/aviala.css" />
    <link rel="icon" href="../assets/img/aviala-favicon.ico" />
  </head>

  <body>
    <div id="site-header"></div>
    <script src="../assets/header.js"></script>

    <table style="width: 80vw; margin-left: auto; margin-right: auto;">
      <tr>
        <td>
          <h2>&lt;&nbsp;&gt;&nbsp;Avilingo</h2>

          <p>Have you ever wondered about the names of birds in other languages?</p>

          <div class="container">
            <div class="search-wrapper">
              <div class="search-box">
                <input
                  id="species-search"
                  type="text"
                  autocomplete="off"
                  placeholder="Search a species..."
                />
                <button
                  type="button"
                  id="clear-search"
                  class="clear-search hidden"
                  aria-label="Clear search"
                >
                  ×
                </button>
              </div>
              <div id="suggestion-dropdown" class="suggestion-dropdown hidden"></div>
            </div>
            &nbsp;
            <button type="button" class="action-button" id="search-button">
              Search &gt;
            </button>
          </div>

          <div id="search-results"></div>

          <p>
            <a class="selection" href="/aviala/">Back to Aviala</a>
          </p>
        </td>
      </tr>
    </table>

    <script>
      const searchInput = document.getElementById("species-search");
      const searchButton = document.getElementById("search-button");
      const clearSearchButton = document.getElementById("clear-search");
      const searchResults = document.getElementById("search-results");
      const suggestionDropdown = document.getElementById("suggestion-dropdown");
      let speciesDatabase = [];

      function updateClearButton() {
        const hasValue = searchInput.value.trim().length > 0;
        clearSearchButton.classList.toggle("hidden", !hasValue);
      }

      function normalizeText(value) {
        return String(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function scoreSpecies(species, query) {
        const fields = [
          { value: species.Scientific, weight: 6 },
          { value: species["English_ AviList"], weight: 4 },
          { value: species.French, weight: 3 },
          { value: species.Spanish, weight: 3 },
          { value: species.German, weight: 3 },
          { value: species.Norwegian, weight: 3 }
        ];

        let total = 0;

        fields.forEach(({ value, weight }) => {
          if (!value) return;

          const normalizedValue = normalizeText(value);
          if (!normalizedValue) return;

          if (normalizedValue === query) {
            total += 100 * weight;
            return;
          }

          if (normalizedValue.startsWith(query)) {
            total += 70 * weight;
            return;
          }

          if (normalizedValue.includes(query)) {
            total += 35 * weight;
          }
        });

        return total;
      }

      function getBestMatch(species, query) {
        const fields = [
          { label: "Scientific", value: species.Scientific },
          { label: "English", value: species["English_ AviList"] },
          { label: "French", value: species.French },
          { label: "Spanish", value: species.Spanish },
          { label: "German", value: species.German },
          { label: "Norwegian", value: species.Norwegian }
        ];

        let best = null;

        fields.forEach((field) => {
          if (!field.value) return;

          const normalizedValue = normalizeText(field.value);
          const matchIndex = normalizedValue.indexOf(query);

          if (matchIndex === -1) return;

          const score = (normalizedValue === query ? 100 : normalizedValue.startsWith(query) ? 70 : 35) - matchIndex;

          if (!best || score > best.score) {
            best = {
              label: field.label,
              value: field.value,
              matchIndex,
              score
            };
          }
        });

        return best;
      }

      function renderHighlightedMatch(value, query) {
        const normalizedValue = normalizeText(value);
        const matchIndex = normalizedValue.indexOf(query);

        if (matchIndex === -1) {
          return value;
        }

        const before = value.slice(0, matchIndex);
        const matched = value.slice(matchIndex, matchIndex + query.length);
        const after = value.slice(matchIndex + query.length);

        return `${before}<mark>${matched}</mark>${after}`;
      }

      function hideSuggestions() {
        suggestionDropdown.classList.add("hidden");
        suggestionDropdown.innerHTML = "";
      }

      function showSuggestions(matches) {
        if (!matches.length) {
          hideSuggestions();
          return;
        }

        suggestionDropdown.innerHTML = matches
          .map((item) => {
            const match = getBestMatch(item.species, item.query);
            const englishName = item.species["English_ AviList"] || "";
            const englishMatch = englishName ? renderHighlightedMatch(englishName, item.query) : "";
            const matchedValue = match ? renderHighlightedMatch(match.value, item.query) : item.species.Scientific;

            return `
              <button type="button" class="suggestion-item" data-scientific="${item.species.Scientific}">
                <span class="suggestion-main">${item.species.Scientific}</span>
                <span class="suggestion-secondary">
                  <span class="suggestion-field">English:</span>
                  ${englishMatch || englishName || "—"}
                </span>
                <span class="suggestion-secondary">
                  <span class="suggestion-field">${match ? match.label : "Match"}:</span>
                  ${matchedValue}
                </span>
              </button>
            `;
          })
          .join("");

        suggestionDropdown.classList.remove("hidden");

        suggestionDropdown.querySelectorAll(".suggestion-item").forEach((button) => {
          button.addEventListener("click", () => {
            const selected = speciesDatabase.find(
              (species) => species.Scientific === button.dataset.scientific
            );

            if (selected) {
              searchInput.value = selected.Scientific;
              hideSuggestions();
              renderSpecies(selected);
            }
          });
        });
      }

      function updateSuggestions() {
        const query = normalizeText(searchInput.value);

        if (query.length < 2) {
          hideSuggestions();
          return;
        }

        const matches = speciesDatabase
          .map((species) => ({ species, score: scoreSpecies(species, query), query }))
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 8);

        showSuggestions(matches);
      }

      function renderSpecies(species) {
        if (!species) {
          searchResults.innerHTML =
            '<p class="language-box search-status">No matching species found.</p>';
          return;
        }

        const nameFields = [
          {
            label: "Scientific/Latin",
            value: species.Scientific,
            italic: true,
            flag: "../assets/img/flag-earth.svg"
          },
          {
            label: "English / English (AviList)",
            value: species["English_ AviList"],
            flag: "../assets/img/flag-uk.svg"
          },
          {
            label: "French / Français",
            value: species.French,
            flag: "../assets/img/flag-france.svg"
          },
          {
            label: "Spanish / Español",
            value: species.Spanish,
            flag: "../assets/img/flag-spain.svg"
          },
          {
            label: "German / Deutsch",
            value: species.German,
            flag: "../assets/img/flag-germany.svg"
          },
          {
            label: "Norwegian / Norsk",
            value: species.Norwegian,
            flag: "../assets/img/flag-norway.svg"
          }
        ];

        const info = nameFields
          .filter((field) => field.value)
          .map((field) => {
            const valueHtml = field.italic ? `<i>${field.value}</i>` : field.value;
            return `
              <p class="language-box">
                <img src="${field.flag}" style="width: 20px;" />
                &nbsp;&nbsp;
                <strong>${field.label}</strong>
                <br />
                ${valueHtml}
              </p>
            `;
          })
          .join("");

        searchResults.innerHTML = `
          <div class="species-result-panel">
            <p class="language-box species-link-box">
              Read more about this species at
              <strong>
                <a href="https://birdsoftheworld.org/bow/species/grefla3" target="_blank">Birds of the World</a>
              </strong>
            </p>
            <div class="species-result-grid">
              ${info}
            </div>
          </div>
        `;
      }

      function findMatches(query) {
        const normalizedQuery = query.trim().toLowerCase();

        if (!normalizedQuery) {
          return speciesDatabase.filter((species) => species.Scientific === "Phoenicopterus roseus");
        }

        return speciesDatabase.filter((species) =>
          Object.values(species).some((value) =>
            String(value).toLowerCase().includes(normalizedQuery)
          )
        );
      }

      function updateSearchResults() {
        const matches = findMatches(searchInput.value);
        renderSpecies(matches[0] || null);

        if (matches.length > 1) {
          const links = matches
            .slice(0, 5)
            .map(
              (species) =>
                `<span class="search-result-link" data-scientific="${species.Scientific}">${species.Scientific}</span>`
            )
            .join(" &nbsp; ");

          searchResults.insertAdjacentHTML(
            "beforeend",
            `<p class="search-status">Showing ${matches.length} match${matches.length > 1 ? "es" : ""}. ${links}</p>`
          );

          searchResults.querySelectorAll(".search-result-link").forEach((link) => {
            link.addEventListener("click", () => {
              const selected = speciesDatabase.find(
                (species) => species.Scientific === link.dataset.scientific
              );
              searchInput.value = selected?.Scientific || "";
              renderSpecies(selected);
            });
          });
        }
      }

      fetch("species.json")
        .then((response) => response.json())
        .then((data) => {
          speciesDatabase = data;
          updateSearchResults();
        })
        .catch(() => {
          searchResults.innerHTML =
            '<p class="language-box search-status">Unable to load bird species data.</p>';
        });

      searchButton.addEventListener("click", updateSearchResults);
      searchInput.addEventListener("input", () => {
        updateSuggestions();
        updateClearButton();
      });
      searchInput.addEventListener("focus", updateSuggestions);
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          hideSuggestions();
          updateSearchResults();
        }
      });

      clearSearchButton.addEventListener("click", () => {
        searchInput.value = "";
        updateClearButton();
        hideSuggestions();
        searchInput.focus();
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search-wrapper") && !event.target.closest(".suggestion-item")) {
          hideSuggestions();
        }
      });
    </script>
  </body>
</html>
