<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avilingo - Bird name translator</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/aviala.css" />
    <link rel="icon" href="../assets/img/aviala-favicon.ico" />
  </head>

  <body>
    <div id="site-header"></div>
    <script src="../assets/header.js"></script>

    <table style="width: 80vw; margin-left: auto; margin-right: auto;">
      <tr>
        <td>
          <h2>&lt;&nbsp;&gt;&nbsp;Avilingo</h2>

          <p>Have you ever wondered about the names of birds in other languages?</p>

          <div class="container">
            <div class="search-box">
              <input type="text" placeholder="Search a species..." />
            </div>
            &nbsp;
            <div class="action-button">Search &gt;</div>
          </div>

          <div>
            <p class="language-box">
              Read more about this species at
              <strong>
                <a
                  href="https://birdsoftheworld.org/bow/species/grefla3"
                  target="_blank"
                  >Birds of the World</a
                >
              </strong>
            </p>

            <p class="language-box">
              <strong>Scientific/Latin</strong>
              <br />
              <i>Phoenicopterus roseus</i>
            </p>

            <p class="language-box">
              <img src="../assets/img/flag-uk.svg" style="width: 20px;" />
              &nbsp;&nbsp;
              <strong>English-UK</strong>
              <br />
              Greater Flamingo
            </p>

            <p class="language-box">
              <img src="../assets/img/flag-norway.svg" style="width: 20px;" />
              &nbsp;&nbsp;
              <strong>Norwegian / Norsk</strong>
              <br />
              rosenflamingo
            </p>

            <p class="language-box">
              <img src="../assets/img/flag-sweden.svg" style="width: 20px;" />
              &nbsp;&nbsp;
              <strong>Swedish / Svenska</strong>
              <br />
              större flamingo
            </p>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
